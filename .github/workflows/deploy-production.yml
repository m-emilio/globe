name: Deploy production globe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-globe

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Deploy the globe Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning::Production deploy skipped. Set the Cloudflare API token and account ID in GitHub Actions."
            exit 0
          fi
          npm run deploy -- --keep-vars
          # Wrangler 4.107 has no config field for query redaction.
          node --input-type=module <<'JS'
          const { CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN } = process.env;
          const endpoint = "https://api.cloudflare.com/client/v4/accounts/" +
            CLOUDFLARE_ACCOUNT_ID + "/workers/scripts/globe/script-settings";
          const headers = {
            authorization: "Bearer " + CLOUDFLARE_API_TOKEN,
            "content-type": "application/json",
          };
          const getSettings = async () => {
            const response = await fetch(endpoint, { headers, signal: AbortSignal.timeout(10_000) });
            if (!response.ok) throw new Error("Could not read Worker settings: HTTP " + response.status);
            const settings = (await response.json()).result?.observability;
            if (!settings) throw new Error("Worker observability settings were missing.");
            return settings;
          };
          const settings = await getSettings();
          if (!settings.redact_query_string) {
            const response = await fetch(endpoint, {
              method: "PATCH", headers, signal: AbortSignal.timeout(10_000),
              body: JSON.stringify({ observability: { ...settings, redact_query_string: true } }),
            });
            if (!response.ok) throw new Error("Could not redact Worker URLs: HTTP " + response.status);
            if (!(await getSettings()).redact_query_string) throw new Error("Query redaction is inactive.");
          }
          console.log("Worker request log query redaction is enabled.");
          JS
